<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ef6c00">
<title>Les Théorèmes — Espace scolaire</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="screen-login" class="login-wrap">
  <div class="login-top">
    <img src="logo.png" alt="Les Théorèmes" class="login-logo">
    <p class="login-sub" data-i18n="school_sub">Préscolaire · Primaire · Collège</p>
  </div>

  <form id="login-form" class="login-card" autocomplete="on">
    <h1 data-i18n="login_title">Connexion</h1>
    <p class="hint" data-i18n="login_hint">Utilisez le compte remis par l'administration.</p>

    <label for="email" data-i18n="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="username"
           placeholder="nom@exemple.dz" required>

    <label for="password" data-i18n="password">Mot de passe</label>
    <div class="pw-row">
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="••••••••" required>
      <button type="button" id="pw-toggle" class="ghost" aria-label="Afficher">👁</button>
    </div>

    <p id="login-error" class="error" role="alert"></p>
    <button type="submit" class="btn primary" data-i18n="sign_in">Se connecter</button>

    <div class="lang-switch" role="group" aria-label="Langue">
      <button type="button" data-lang="fr" class="lang-btn">FR</button>
      <button type="button" data-lang="ar" class="lang-btn">ع</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
    </div>
  </form>

  <div class="login-foot">
    <p>Groupe Scolaire Les Théorèmes</p>
    <p data-i18n="no_account">Pas de compte ? Il est créé par l'administration de l'école.</p>
  </div>
</section>

<!-- ============ APPLICATION ============ -->
<div id="screen-app" class="app-shell" hidden>
  <header class="topbar">
    <button id="btn-lang" class="topbar-btn" title="Langue">
      <svg viewBox="0 0 24 24" class="ico-sm" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/>
      </svg>
      <span id="lang-label">FR</span>
    </button>
    <div class="topbar-title">
      <strong id="user-name">—</strong>
      <small id="user-role">—</small>
    </div>
    <img src="logo.png" alt="" class="topbar-logo">
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24" class="ico"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span data-i18n="nav_home">Accueil</span>
    </button>
    <button class="tab" data-tab="messages">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>
      <span data-i18n="nav_messages">Messages</span>
      <em class="badge" id="msg-badge" hidden>0</em>
    </button>
    <button class="tab" data-tab="children">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.5 20c0-2.5 1.2-4.4 3.5-4.4S22 17.5 22 20"/></svg>
      <span data-i18n="nav_children">Enfants</span>
    </button>
    <button class="tab" data-tab="account">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
      <span data-i18n="nav_account">Compte</span>
    </button>
  </nav>
</div>

<!-- notification discrete -->
<div id="toast" class="toast" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
